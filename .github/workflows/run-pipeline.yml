name: Run prediction pipeline

# Runs every day from the 7th to the 14th of each month at 9:00 AM Philippine time (01:00 UTC).
# The RHU enters last month's cases by the 5th; running on several days catches late entries.
# Re-running is safe: results for the same month are simply replaced.
# It can also be started by hand (Actions tab, or the Run prediction button on the dashboard).
on:
  schedule:
    - cron: "0 1 7-14 * *"
  workflow_dispatch:

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r ml/requirements.txt
      - name: Update weather (last 24 months)
        working-directory: ml
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # Only complete months: from 24 months ago to the last day of the previous month.
        run: python weather.py "$(date -d '24 months ago' +%Y-%m-01)" "$(date -d "$(date +%Y-%m-01) -1 day" +%Y-%m-%d)"
      - name: Run pipeline
        working-directory: ml
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python pipeline.py
